services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: liquorfy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liquorfy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dev_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/dockerfiles/api.Dockerfile
    init: true
    env_file:
      - ../.env.example
    volumes:
      - ../api:/app/api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: infra/dockerfiles/worker.prod.Dockerfile
    init: true
    env_file:
      - ../.env.example
    volumes:
      - ../api:/app/api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: infra/dockerfiles/api.Dockerfile
    command: python -m app.workers.scheduler
    init: true
    env_file:
      - ../.env.example
    volumes:
      - ../api:/app/api
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/dockerfiles/web.Dockerfile
    init: true
    volumes:
      - ../web:/app/web
      - /app/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  dev_postgres_data:
  dev_redis_data:
