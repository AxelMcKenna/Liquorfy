[project]
name = "liquorfy"
version = "0.1.0"
description = "Liquorfy API and web app"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [
  { name = "Liquorfy AI", email = "dev@example.com" },
]
dependencies = [
  "aiosqlite>=0.19.0,<0.20.0",
  "alembic>=1.13.1,<2.0.0",
  "asyncpg>=0.29.0,<0.30.0",
  "bcrypt>=4.0.1,<5.0.0",
  "fastapi>=0.110.0,<0.111.0",
  "geoalchemy2>=0.14.3,<0.15.0",
  "httpx[http2]>=0.27.0,<0.28.0",
  "playwright>=1.40.0,<2.0.0",
  "psycopg[binary]>=3.1.8,<4.0.0",
  "pydantic>=1.10.7,<2.0.0",
  "pyjwt>=2.8.0,<3.0.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "python-dotenv>=1.2.1,<2.0.0",
  "pytz>=2025.2,<2026.0",
  "redis[hiredis]>=5.0.1,<6.0.0",
  "selectolax>=0.3.15,<0.4.0",
  "slowapi>=0.1.9,<0.2.0",
  "sqlalchemy>=2.0.29,<3.0.0",
  "undetected-playwright>=0.3.0,<0.4.0",
  "uvicorn>=0.21.1,<0.22.0",
]

[dependency-groups]
dev = [
  "httpx[cli]>=0.27.0,<0.28.0",
  "mypy==2.3.0",
  "pytest>=7.3.1,<8.0.0",
  "pytest-asyncio>=0.21.0,<0.22.0",
  "ruff==0.15.22",
]

[tool.uv]
required-version = "==0.11.26"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = [
  "api/app/tests/",
  "api/app/scrapers/",
  "api/app/store_scrapers/",
]

[[tool.mypy.overrides]]
module = ["app.scrapers.*", "app.store_scrapers.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["api/app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api/app"]
